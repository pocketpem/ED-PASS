<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ED-PASS</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    #login {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      width: min(85%, 320px);
      text-align: center;
    }

    h1 {
      margin-bottom: 24px;
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      box-sizing: border-box;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      cursor: pointer;
    }

    #error {
      color: #b00020;
      margin-top: 12px;
      display: none;
    }

    #content {
      display: none;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #content img {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }
  </style>
</head>

<body>

  <div id="login">
    <div class="login-box">
      <h1>ED-PASS</h1>

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button onclick="checkPassword()">Enter</button>

      <div id="error">Incorrect password</div>
    </div>
  </div>

  <div id="content">
    <img src="ED-PASS.jpeg" alt="ED-PASS">
  </div>

  <script>
    function checkPassword() {

      const password = document.getElementById("password").value;

      if (password === "gurneyroom") {

        document.getElementById("login").style.display = "none";
        document.getElementById("content").style.display = "flex";

      } else {

        document.getElementById("error").style.display = "block";

      }
    }

    document.getElementById("password").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        checkPassword();
      }
    });
  </script>

</body>
</html>
