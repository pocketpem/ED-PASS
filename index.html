<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>EM Pocket Pearls</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f4f4f4;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
    }

    header {
      background: white;
      text-align: center;
      padding: 18px 12px;
      border-bottom: 1px solid #ddd;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      margin: 5px 0 0;
      color: #666;
      font-size: 15px;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
    }

    .pearl {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.10);
    }

    .pearl h2 {
      margin: 0;
      padding: 14px 16px;
      font-size: 22px;
    }

    .pearl img {
      display: block;
      width: 100%;
      height: auto;
    }

    @media (max-width: 600px) {
      main {
        padding: 0;
      }

      .pearl {
        border-radius: 0;
        box-shadow: none;
        margin-bottom: 12px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>EM Pocket Pearls</h1>
  <p>Emergency Medicine Quick Reference</p>
</header>

<main id="pearls"></main>

<script src="pearls.js"></script>

<script>
  const container = document.getElementById("pearls");

  pearls.forEach(pearl => {
    const card = document.createElement("section");
    card.className = "pearl";

    card.innerHTML = `
      <h2>${pearl.title}</h2>
      <a href="${pearl.image}">
        <img src="${pearl.image}" alt="${pearl.title}" loading="lazy">
      </a>
    `;

    container.appendChild(card);
  });
</script>

</body>
</html>
